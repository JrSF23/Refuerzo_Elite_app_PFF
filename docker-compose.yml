services:

  # ── Nginx — reverse proxy y servidor de estáticos ─────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/var/www/frontend/dist:ro
    depends_on:
      - laravel
    networks:
      - app
    restart: unless-stopped

  # ── Laravel — PHP-FPM ─────────────────────────────────────────────────────
  laravel:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      APP_NAME: "Refuerzo Elite"
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost}

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}

      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database

      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - backend_storage:/var/www/backend/storage
      - backend_cache:/var/www/backend/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app
    restart: unless-stopped

  # ── MySQL 8 ───────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

# ── Volúmenes persistentes ─────────────────────────────────────────────────
volumes:
  mysql_data:
  backend_storage:
  backend_cache:

# ── Red interna — los servicios se ven entre sí por nombre ────────────────
networks:
  app:
    driver: bridge
