# Este fichero se carga automáticamente sobre docker-compose.yml en desarrollo.
# NO incluir en producción.
#
# Diferencias con producción:
#   - El código fuente del backend se monta como volumen (cambios en vivo).
#   - MySQL expone el puerto 3306 para conectar con TablePlus, DBeaver, etc.
#   - APP_DEBUG activado y logs en stderr para leerlos con "docker compose logs".

services:

  laravel:
    environment:
      APP_ENV: local
      # TEMPORAL — apagado mientras el túnel de ngrok esté abierto. Con la
      # aplicación publicada, un error 500 devolvería el volcado de Laravel con
      # APP_KEY y la contraseña de MySQL dentro. Volver a "true" al cerrarlo.
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
    volumes:
      # Monta el código fuente directamente: cualquier cambio PHP se refleja
      # sin necesidad de reconstruir la imagen.
      - ./backend:/var/www/backend
      # Pero conservamos los volúmenes de storage y vendor del contenedor
      # para no pisarlos con los del host.
      - backend_storage:/var/www/backend/storage
      - /var/www/backend/vendor

  # mysql: port non exposé — XAMPP occupe déjà 3306 et 3307 sur cet hôte.

  # El scheduler recibe el mismo trato de desarrollo que `laravel`.
  #
  # Sin esto ejecutaría el código HORNEADO en la imagen mientras `laravel`
  # ejecuta el montado desde el anfitrión: los dos correrían versiones distintas
  # del mismo proyecto, y una tarea programada seguiría comportándose como antes
  # de un cambio que ya está en pantalla. Es de los desajustes más difíciles de
  # diagnosticar, porque todo «parece» actualizado.
  scheduler:
    environment:
      APP_ENV: local
      # Igual que arriba: apagado mientras el túnel esté abierto.
      APP_DEBUG: "false"
      # A stderr para poder seguir las tareas con `docker compose logs
      # scheduler`, que es la única ventana a lo que hace un proceso de fondo.
      LOG_CHANNEL: stderr
    volumes:
      - ./backend:/var/www/backend
      - backend_storage:/var/www/backend/storage
      - /var/www/backend/vendor
      # Su caché sigue siendo suya también en desarrollo.
      - scheduler_cache:/var/www/backend/bootstrap/cache
