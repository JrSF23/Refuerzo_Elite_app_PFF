server {
    listen 80;
    server_name _;

    # ── Compresión ────────────────────────────────────────────────────────────
    #
    # El bundle del frontend pesa ~410 kB en crudo y ~125 kB comprimido. Sin esto
    # viajaba entero: por el túnel de ngrok eran ONCE SEGUNDOS de espera en la
    # primera carga, contra 12 ms en localhost. Medido, no supuesto.
    #
    # Afecta también a las respuestas de la API, que es lo que se nota al abrir
    # cada pantalla: un listado son decenas de kB de JSON y cada petición arrastra
    # ~1 s de latencia de túnel. Comprimirlo es lo que más se percibe en uso real.
    #
    # NO se comprimen las fuentes (.woff2) ni las imágenes: ya vienen comprimidas
    # y volver a pasarlas por gzip gasta CPU para no quitar ni un byte.
    #
    # `gzip_vary` añade `Vary: Accept-Encoding`, imprescindible con caché por
    # delante: sin él, un intermediario puede servir la versión comprimida a un
    # cliente que no la entiende.
    #
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    # Las respuestas que llegan de PHP-FPM también entran.
    gzip_proxied      any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        text/css
        text/plain
        text/xml;

    # ── API → Laravel (PHP-FPM) ───────────────────────────────────────────────
    #
    # All /api/* requests are forwarded to the laravel container via FastCGI.
    # SCRIPT_FILENAME always points to Laravel's single entry point (index.php),
    # which handles all routing internally.
    #
    location /api {
        fastcgi_pass laravel:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param REQUEST_URI     $request_uri;
        fastcgi_param QUERY_STRING    $query_string;
        fastcgi_param REQUEST_METHOD  $request_method;
        fastcgi_param CONTENT_TYPE    $content_type;
        fastcgi_param CONTENT_LENGTH  $content_length;
        fastcgi_param SERVER_NAME     $server_name;
        fastcgi_param SERVER_PORT     $server_port;
        fastcgi_param REMOTE_ADDR     $remote_addr;
        fastcgi_param HTTPS           $https if_not_empty;
        include fastcgi_params;

        # Increase timeouts for long-running requests (seeders, exports)
        fastcgi_read_timeout 120s;
    }

    # ── React SPA ─────────────────────────────────────────────────────────────
    #
    # Static assets (JS, CSS, images) are served directly.
    # Any other path falls back to index.html so React Router handles routing.
    #
    location / {
        root  /var/www/frontend/dist;
        index index.html;

        # Cache hashed assets aggressively (Vite adds content hash to filenames)
        location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        try_files $uri $uri/ /index.html;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy       "strict-origin" always;

    # Hide Nginx version from error pages
    server_tokens off;

    # Reject requests to hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }
}
