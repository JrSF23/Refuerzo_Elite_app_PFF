name: Tests

# SC-008: las pruebas de aislamiento se ejecutan de forma automática y
# desatendida en cada envío de cambios, no cuando alguien se acuerda de
# lanzarlas. El Principio V las declara no negociables: ninguna feature que
# toque datos de organización está terminada sin ellas en verde.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# Un push nuevo sobre la misma rama cancela la ejecución anterior: no tiene
# sentido gastar minutos en validar un commit ya superado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — PHPUnit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          # La suite corre sobre SQLite en memoria (phpunit.xml), así que
          # pdo_sqlite es imprescindible.
          extensions: pdo_sqlite, sqlite3, mbstring, bcmath
          coverage: none

      - name: Cachear dependencias de Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Instalar dependencias
        # Con dev: aquí sí hace falta PHPUnit, al contrario que en la imagen de
        # producción, que se construye con --no-dev.
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar el entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Ejecutar la suite
        run: php artisan test

      - name: Comprobar que la batería de aislamiento existe y pasa
        # Guarda explícita: si alguien renombra o borra estos ficheros, la suite
        # completa seguiría en verde y SC-008 se incumpliría en silencio.
        run: |
          php artisan test \
            --filter='TenantIsolationTest|CrossReferenceValidationTest|SuperAdminBusinessDataTest|ClientOrganizationIdIgnoredTest|SoftDeleteIsolationTest|UniquePerOrganizationTest|RouteTenantCoverageTest'

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Construir
        run: npm run build
