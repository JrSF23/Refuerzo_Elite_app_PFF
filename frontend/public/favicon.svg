<!--
  Marca de SmartWork: la red de nodos de `src/components/ui/Logo.jsx` sobre el
  cuadrado azul que en la aplicación pone el contenedor.

  Aquí los colores VAN ESCRITOS y no pueden salir de los tokens: es un recurso
  estático de `public/`, lo pide el navegador fuera de la aplicación y nunca pasa
  por el CSS. Son los mismos valores de los tokens de color primario y de texto
  inverso; si esos cambian, este fichero hay que cambiarlo a mano.

  NO se pueden nombrar aquí con su sintaxis real: un fichero .svg se analiza como
  XML estricto y un comentario XML no admite dos guiones seguidos. Escribirlos
  invalida el documento entero y el navegador se queda sin icono, sin avisar de
  nada.

  Geometría: el dibujo es de 18x18 centrado en 32x32, así que va desplazado 7 px.
  Las líneas se dibujan antes que los círculos para que estos las tapen.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#2563EB"/>
  <g stroke="#F8FAFC" stroke-width="1.5" stroke-linecap="round">
    <line x1="16" y1="10.8" x2="10.5" y2="20.8"/>
    <line x1="16" y1="10.8" x2="21.5" y2="20.8"/>
    <line x1="10.5" y1="20.8" x2="21.5" y2="20.8"/>
  </g>
  <g fill="#F8FAFC">
    <circle cx="16" cy="10.8" r="2.3"/>
    <circle cx="10.5" cy="20.8" r="2.3"/>
    <circle cx="21.5" cy="20.8" r="2.3"/>
  </g>
</svg>
