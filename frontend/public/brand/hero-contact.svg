  <rect x="432" y="105" width="178" height="110" rx="16" fill="#091C14" stroke="#7DFF99" stroke-width="2"/>
  <polygon points="608,155 640,180 598,165" fill="#091C14" stroke="#7DFF99" stroke-width="2"/>
  <polygon points="606,163 618,163 610,158" fill="#091C14"/>
  <!-- Bubble content -->
  <rect x="448" y="124" width="130" height="6"   rx="3"   fill="#7DFF99" opacity="0.8"/>
  <rect x="448" y="138" width="114" height="4.5" rx="2.2" fill="#1A4828" opacity="0.6"/>
  <rect x="448" y="149" width="124" height="4.5" rx="2.2" fill="#1A4828" opacity="0.55"/>
  <rect x="448" y="160" width="100" height="4.5" rx="2.2" fill="#1A4828" opacity="0.55"/>
  <rect x="448" y="171" width="116" height="4.5" rx="2.2" fill="#1A4828" opacity="0.5"/>
  <rect x="448" y="182" width="90"  height="4.5" rx="2.2" fill="#1A4828" opacity="0.5"/>
  <!-- Check mark at end -->
  <circle cx="574" cy="198" r="11" fill="#0E3020" stroke="#7DFF99" stroke-width="1.5"/>
  <polyline points="569,198 573,203 580,193" stroke="#7DFF99" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- ─── Central hub / Institution ───────────────────────────────────── -->
  <!-- Outer ring glow -->
  <circle cx="400" cy="280" r="88" fill="#2AD267" opacity="0.06"/>
  <!-- Main circle -->
  <circle cx="400" cy="280" r="72" fill="#081A12" stroke="#2AD267" stroke-width="2.5"/>
  <circle cx="400" cy="280" r="60" fill="#091C14" stroke="#1E5630" stroke-width="1"/>
  <!-- Logo-like center mark -->
  <circle cx="400" cy="280" r="22" fill="#0B2818" stroke="#2AD267" stroke-width="2"/>
  <!-- R monogram shape -->
  <rect x="390" y="266" width="6" height="28" rx="3" fill="#2AD267" opacity="0.9"/>
  <path d="M396 266 Q420 266 420 278 Q420 290 396 290" stroke="#2AD267" stroke-width="5" stroke-linecap="round" fill="none"/>
  <line x1="403" y1="290" x2="416" y2="306" stroke="#2AD267" stroke-width="4" stroke-linecap="round"/>
  <!-- Label ring text hint -->
  <rect x="340" y="340" width="120" height="5" rx="2.5" fill="#2AD267" opacity="0.4"/>
  <rect x="352" y="350" width="96"  height="4" rx="2"   fill="#1A4828" opacity="0.35"/>

  <!-- Connection line: person 1 → hub -->
  <line x1="182" y1="285" x2="328" y2="280" stroke="#1E5630" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="182" cy="285" r="5" fill="#2AD267" opacity="0.7"/>
  <circle cx="328" cy="280" r="5" fill="#2AD267" opacity="0.7"/>

  <!-- Connection line: hub → person 2 -->
  <line x1="472" y1="280" x2="618" y2="275" stroke="#1E5630" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="472" cy="280" r="5" fill="#7DFF99" opacity="0.7"/>
  <circle cx="618" cy="275" r="5" fill="#7DFF99" opacity="0.7"/>

  <!-- ─── Contact channel icons (bottom) ──────────────────────────────── -->
  <!-- WhatsApp card -->
  <rect x="160" y="440" width="130" height="52" rx="12" fill="#081A12" stroke="#1E5630" stroke-width="1.5"/>
  <rect x="160" y="440" width="5"   height="52" rx="2.5" fill="#2AD267"/>
  <!-- Phone icon -->
  <rect x="175" y="453" width="26" height="26" rx="6" fill="#0B2818"/>
  <path d="M181 459 Q181 463 185 465 Q187 465 189 463 L191 461 Q193 459 191 457 Q189 455 187 457 Q185 458 183 459 Q179 463 183 469 Q185 473 189 475 Q191 475 193 473 L195 471 Q197 469 195 467 Q193 465 191 467" stroke="#2AD267" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <rect x="208" y="452" width="74"  height="6"   rx="3"   fill="#2AD267" opacity="0.75"/>
  <rect x="208" y="464" width="60"  height="4.5" rx="2.2" fill="#1A4828" opacity="0.55"/>
  <rect x="208" y="474" width="68"  height="4.5" rx="2.2" fill="#1A4828" opacity="0.5"/>

  <!-- Email card -->
  <rect x="510" y="440" width="130" height="52" rx="12" fill="#081A12" stroke="#1E5630" stroke-width="1.5"/>
  <rect x="510" y="440" width="5"   height="52" rx="2.5" fill="#7DFF99"/>
  <!-- Envelope icon -->
  <rect x="525" y="453" width="26" height="20" rx="4" fill="#0B2818" stroke="#7DFF99" stroke-width="1.2"/>
  <polyline points="525,453 538,463 551,453" stroke="#7DFF99" stroke-width="1.2" fill="none"/>
  <rect x="558" y="452" width="74"  height="6"   rx="3"   fill="#7DFF99" opacity="0.75"/>
  <rect x="558" y="464" width="60"  height="4.5" rx="2.2" fill="#1A4828" opacity="0.55"/>
  <rect x="558" y="474" width="68"  height="4.5" rx="2.2" fill="#1A4828" opacity="0.5"/>

  <!-- Floating particles -->
  <circle cx="40"  cy="160" r="2"   fill="#2AD267" opacity="0.5"/>
  <circle cx="765" cy="120" r="2.5" fill="#7DFF99" opacity="0.45"/>
  <circle cx="780" cy="420" r="1.8" fill="#2AD267" opacity="0.35"/>
  <circle cx="30"  cy="450" r="2"   fill="#7DFF99" opacity="0.3"/>
  <circle cx="400" cy="14"  r="1.5" fill="#2AD267" opacity="0.4"/>
</svg>
