<svg viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#030805"/>
      <stop offset="55%" stop-color="#05120a"/>
      <stop offset="100%" stop-color="#020604"/>
    </linearGradient>
    <radialGradient id="glow1" cx="60%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#14532d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#14532d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="22%" cy="65%" r="34%">
      <stop offset="0%" stop-color="#166534" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#166534" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur8">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="blur4">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="0.9" fill="#1a3d26" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <ellipse cx="950" cy="380" rx="680" ry="460" fill="url(#glow1)"/>
  <ellipse cx="340" cy="590" rx="520" ry="360" fill="url(#glow2)"/>

  <!-- ── Grid lines (subtle) ──────────────────────────────────────── -->
  <line x1="0" y1="300" x2="1600" y2="300" stroke="#1a3d26" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="600" x2="1600" y2="600" stroke="#1a3d26" stroke-width="1" opacity="0.3"/>
  <line x1="400" y1="0" x2="400" y2="900" stroke="#1a3d26" stroke-width="1" opacity="0.3"/>
  <line x1="800" y1="0" x2="800" y2="900" stroke="#1a3d26" stroke-width="1" opacity="0.3"/>
  <line x1="1200" y1="0" x2="1200" y2="900" stroke="#1a3d26" stroke-width="1" opacity="0.3"/>

  <!-- ── Connection network lines ─────────────────────────────────── -->
  <!-- Central hub to nodes -->
  <line x1="800" y1="450" x2="340" y2="220" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="8 5" opacity="0.35"/>
  <line x1="800" y1="450" x2="1260" y2="200" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="8 5" opacity="0.35"/>
  <line x1="800" y1="450" x2="220"  y2="600" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="8 5" opacity="0.35"/>
  <line x1="800" y1="450" x2="1380" y2="650" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="8 5" opacity="0.35"/>
  <line x1="800" y1="450" x2="580"  y2="760" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="8 5" opacity="0.28"/>
  <line x1="800" y1="450" x2="1060" y2="730" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="8 5" opacity="0.28"/>
  <!-- Cross connections -->
  <line x1="340" y1="220" x2="1260" y2="200" stroke="#4ade80" stroke-width="1" stroke-dasharray="5 8" opacity="0.18"/>
  <line x1="220"  y1="600" x2="580"  y2="760" stroke="#4ade80" stroke-width="1" stroke-dasharray="5 8" opacity="0.18"/>
  <line x1="1380" y1="650" x2="1060" y2="730" stroke="#4ade80" stroke-width="1" stroke-dasharray="5 8" opacity="0.18"/>

  <!-- ── Central hub ───────────────────────────────────────────────── -->
  <circle cx="800" cy="450" r="110" fill="#22c55e" filter="url(#blur8)" opacity="0.12"/>
  <circle cx="800" cy="450" r="82" fill="#061410" stroke="#22c55e" stroke-width="2.5"/>
  <circle cx="800" cy="450" r="68" fill="#071812" stroke="#15803d" stroke-width="1"/>

  <!-- Envelope icon in center hub -->
  <!-- Envelope body -->
  <rect x="758" y="424" width="84" height="58" rx="7" fill="#091f11" stroke="#22c55e" stroke-width="2.2"/>
  <!-- Envelope flap (V shape) -->
  <polyline points="758,424 800,460 842,424" stroke="#22c55e" stroke-width="2.2" fill="none"/>
  <!-- Envelope bottom lines -->
  <line x1="758" y1="482" x2="800" y2="455" stroke="#22c55e" stroke-width="1.5" opacity="0.5"/>
  <line x1="842" y1="482" x2="800" y2="455" stroke="#22c55e" stroke-width="1.5" opacity="0.5"/>

  <!-- ── Satellite node: Phone ────────────────────────────────────── -->
  <circle cx="340" cy="220" r="14" fill="#22c55e" filter="url(#blur4)" opacity="0.3"/>
  <rect x="296" y="166" width="88" height="108" rx="18" fill="#061410" stroke="#22c55e" stroke-width="2"/>
  <!-- Phone screen -->
  <rect x="306" y="180" width="68" height="72" rx="8" fill="#091f14" stroke="#15803d" stroke-width="1"/>
  <!-- Phone notch -->
  <rect x="326" y="173" width="28" height="7" rx="3.5" fill="#071812" stroke="#22c55e" stroke-width="1"/>
  <!-- Phone home button -->
  <circle cx="340" cy="262" r="5" fill="#0b2918" stroke="#22c55e" stroke-width="1.5"/>
  <!-- Screen content lines -->
  <rect x="316" y="194" width="48" height="4" rx="2" fill="#22c55e" opacity="0.7"/>
  <rect x="316" y="204" width="40" height="3" rx="1.5" fill="#4ade80" opacity="0.4"/>
  <rect x="316" y="213" width="44" height="3" rx="1.5" fill="#4ade80" opacity="0.35"/>
  <rect x="316" y="222" width="36" height="3" rx="1.5" fill="#4ade80" opacity="0.3"/>
  <!-- Signal waves -->
  <path d="M316 236 Q340 228 364 236" stroke="#22c55e" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M322 242 Q340 236 358 242" stroke="#22c55e" stroke-width="1.2" fill="none" opacity="0.45"/>

  <!-- Node dot -->
  <circle cx="340" cy="220" r="6" fill="#22c55e" opacity="0.85"/>

  <!-- ── Satellite node: Calendar ─────────────────────────────────── -->
  <circle cx="1260" cy="200" r="14" fill="#22c55e" filter="url(#blur4)" opacity="0.28"/>
  <rect x="1198" y="148" width="124" height="104" rx="14" fill="#061410" stroke="#22c55e" stroke-width="2"/>
  <!-- Calendar header -->
  <rect x="1198" y="148" width="124" height="30" rx="14" fill="#0b2918" stroke="none"/>
  <rect x="1198" y="162" width="124" height="16" rx="0" fill="#0b2918"/>
  <!-- Calendar rings -->
  <rect x="1224" y="141" width="8" height="14" rx="4" fill="#061410" stroke="#22c55e" stroke-width="1.8"/>
  <rect x="1288" y="141" width="8" height="14" rx="4" fill="#061410" stroke="#22c55e" stroke-width="1.8"/>
  <!-- Calendar title -->
  <rect x="1218" y="157" width="84" height="5" rx="2.5" fill="#22c55e" opacity="0.7"/>
  <!-- Calendar grid -->
  <rect x="1210" y="192" width="12" height="12" rx="3" fill="#22c55e" opacity="0.5"/>
  <rect x="1230" y="192" width="12" height="12" rx="3" fill="#15803d" opacity="0.3"/>
  <rect x="1250" y="192" width="12" height="12" rx="3" fill="#15803d" opacity="0.3"/>
  <rect x="1270" y="192" width="12" height="12" rx="3" fill="#22c55e" opacity="0.6"/>
  <rect x="1290" y="192" width="12" height="12" rx="3" fill="#15803d" opacity="0.3"/>
  <rect x="1210" y="210" width="12" height="12" rx="3" fill="#15803d" opacity="0.3"/>
  <rect x="1230" y="210" width="12" height="12" rx="3" fill="#22c55e" opacity="0.75"/>
  <rect x="1250" y="210" width="12" height="12" rx="3" fill="#15803d" opacity="0.3"/>
  <rect x="1270" y="210" width="12" height="12" rx="3" fill="#15803d" opacity="0.3"/>
  <rect x="1290" y="210" width="12" height="12" rx="3" fill="#22c55e" opacity="0.4"/>
  <!-- Node dot -->
  <circle cx="1260" cy="200" r="6" fill="#22c55e" opacity="0.85"/>

  <!-- ── Satellite node: Location pin ────────────────────────────── -->
  <circle cx="220" cy="600" r="14" fill="#22c55e" filter="url(#blur4)" opacity="0.28"/>
  <rect x="172" y="548" width="96" height="84" rx="12" fill="#061410" stroke="#22c55e" stroke-width="2"/>
  <!-- Pin body -->
  <path d="M220 568 m-22,0 a22,22 0 1,0 44,0 a22,22 0 1,0 -44,0" fill="#0b2918" stroke="#22c55e" stroke-width="2"/>
  <!-- Pin inner circle -->
  <circle cx="220" cy="586" r="9" fill="#061410" stroke="#22c55e" stroke-width="1.8"/>
  <circle cx="220" cy="586" r="4" fill="#22c55e" opacity="0.8"/>
  <!-- Pin tail -->
  <path d="M214 606 Q220 622 226 606" fill="#22c55e" opacity="0.6"/>
  <!-- Node dot -->
  <circle cx="220" cy="600" r="6" fill="#22c55e" opacity="0.85"/>

  <!-- ── Satellite node: Chat bubble ──────────────────────────────── -->
  <circle cx="1380" cy="650" r="14" fill="#22c55e" filter="url(#blur4)" opacity="0.28"/>
  <rect x="1316" y="598" width="128" height="84" rx="14" fill="#061410" stroke="#22c55e" stroke-width="2"/>
  <!-- Bubble tail -->
  <polygon points="1330,682 1316,700 1348,682" fill="#061410" stroke="#22c55e" stroke-width="2"/>
  <polygon points="1332,681 1332,683 1348,682" fill="#061410"/>
  <!-- Bubble content lines -->
  <rect x="1332" y="618" width="88" height="5" rx="2.5" fill="#22c55e" opacity="0.75"/>
  <rect x="1332" y="631" width="76" height="4" rx="2" fill="#4ade80" opacity="0.45"/>
  <rect x="1332" y="642" width="82" height="4" rx="2" fill="#4ade80" opacity="0.4"/>
  <rect x="1332" y="653" width="62" height="4" rx="2" fill="#4ade80" opacity="0.35"/>
  <!-- Node dot -->
  <circle cx="1380" cy="650" r="6" fill="#22c55e" opacity="0.85"/>

  <!-- ── Small node: check/status ─────────────────────────────────── -->
  <circle cx="580" cy="760" r="10" fill="#22c55e" filter="url(#blur4)" opacity="0.22"/>
  <rect x="542" y="728" width="76" height="64" rx="10" fill="#061410" stroke="#22c55e" stroke-width="1.5"/>
  <circle cx="580" cy="752" r="14" fill="#0b2918" stroke="#22c55e" stroke-width="1.5"/>
  <polyline points="572,752 578,759 590,744" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <rect x="552" y="774" width="56" height="4" rx="2" fill="#22c55e" opacity="0.5"/>
  <rect x="558" y="782" width="44" height="3" rx="1.5" fill="#4ade80" opacity="0.3"/>
  <circle cx="580" cy="760" r="5" fill="#22c55e" opacity="0.8"/>

  <!-- ── Small node: notification bell ───────────────────────────── -->
  <circle cx="1060" cy="730" r="10" fill="#22c55e" filter="url(#blur4)" opacity="0.22"/>
  <rect x="1022" y="698" width="76" height="64" rx="10" fill="#061410" stroke="#22c55e" stroke-width="1.5"/>
  <!-- Bell shape -->
  <path d="M1060 712 m-16,0 a16,8 0 0,1 32,0 l4,22 h-40 z" fill="#0b2918" stroke="#22c55e" stroke-width="1.8"/>
  <circle cx="1060" cy="712" r="4" fill="#061410" stroke="#22c55e" stroke-width="1.5"/>
  <path d="M1053 734 Q1060 742 1067 734" stroke="#22c55e" stroke-width="1.8" fill="none"/>
  <!-- Notification dot -->
  <circle cx="1072" cy="710" r="5" fill="#22c55e" opacity="0.9"/>
  <circle cx="1060" cy="730" r="5" fill="#22c55e" opacity="0.8"/>

  <!-- ── Floating dots ─────────────────────────────────────────────── -->
  <circle cx="120"  cy="130" r="3"   fill="#22c55e" opacity="0.4"/>
  <circle cx="490"  cy="80"  r="2"   fill="#4ade80" opacity="0.35"/>
  <circle cx="970"  cy="60"  r="2.5" fill="#22c55e" opacity="0.3"/>
  <circle cx="1460" cy="100" r="2"   fill="#4ade80" opacity="0.4"/>
  <circle cx="1530" cy="430" r="3"   fill="#22c55e" opacity="0.3"/>
  <circle cx="70"   cy="780" r="2.5" fill="#4ade80" opacity="0.35"/>
  <circle cx="1540" cy="820" r="2"   fill="#22c55e" opacity="0.3"/>
  <circle cx="700"  cy="870" r="3"   fill="#4ade80" opacity="0.3"/>
  <circle cx="1100" cy="860" r="2"   fill="#22c55e" opacity="0.35"/>

  <!-- ── Subtle arc decorations ───────────────────────────────────── -->
  <circle cx="800" cy="450" r="160" stroke="#22c55e" stroke-width="1" opacity="0.08" fill="none" stroke-dasharray="12 8"/>
  <circle cx="800" cy="450" r="240" stroke="#22c55e" stroke-width="1" opacity="0.05" fill="none" stroke-dasharray="8 14"/>
</svg>
