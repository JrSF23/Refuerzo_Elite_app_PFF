<svg viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-m" x1="0" y1="0" x2="800" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#061510"/>
      <stop offset="100%" stop-color="#040D07"/>
    </linearGradient>
    <radialGradient id="glow-m1" cx="25%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#1A6038" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#1A6038" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-m2" cx="75%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#2AD267" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2AD267" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2AD267" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2AD267" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dot-m" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="0.85" fill="#1A3E26" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="800" height="520" fill="url(#bg-m)"/>
  <rect width="800" height="520" fill="url(#dot-m)"/>
  <ellipse cx="200" cy="260" rx="300" ry="240" fill="url(#glow-m1)"/>
  <ellipse cx="600" cy="260" rx="300" ry="240" fill="url(#glow-m2)"/>

  <!-- ─── Title area ──────────────────────────────────────────────────── -->
  <rect x="250" y="30" width="300" height="44" rx="22" fill="#081A12" stroke="#1E5630" stroke-width="1.5"/>
  <rect x="263" y="43" width="160" height="6" rx="3" fill="#2AD267" opacity="0.8"/>
  <rect x="263" y="55" width="130" height="5" rx="2.5" fill="#1A4828" opacity="0.55"/>

  <!-- ─── Curved path connecting all 4 steps ─────────────────────────── -->
  <!-- Path from step 1 to step 4 — sweeping upward arc -->
  <path d="M 130 390 C 200 350, 260 200, 340 200 C 420 200, 460 330, 540 300 C 620 270, 640 180, 720 160"
        stroke="#1E5630" stroke-width="2.5" stroke-dasharray="6 4" fill="none" stroke-linecap="round"/>

  <!-- Glowing path overlay -->
  <path d="M 130 390 C 200 350, 260 200, 340 200 C 420 200, 460 330, 540 300 C 620 270, 640 180, 720 160"
        stroke="#2AD267" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.45"/>

  <!-- ─── STEP 1 — Observer (bottom left) ────────────────────────────── -->
  <ellipse cx="130" cy="390" rx="70" ry="70" fill="#2AD267" opacity="0.08"/>
  <circle cx="130" cy="390" r="52" fill="#081A12" stroke="#2AD267" stroke-width="2.5"/>
  <circle cx="130" cy="390" r="40" fill="#0A2016" stroke="#1E5630" stroke-width="1"/>
  <!-- Number -->
  <text x="130" y="382" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#2AD267" text-anchor="middle" opacity="0.95">01</text>
  <!-- Icon: eye / observe -->
  <ellipse cx="130" cy="400" rx="14" ry="9" fill="none" stroke="#2AD267" stroke-width="1.5"/>
  <circle cx="130" cy="400" r="4" fill="#2AD267" opacity="0.9"/>
  <circle cx="130" cy="400" r="1.8" fill="#081A12"/>

  <!-- Step 1 card -->
  <rect x="40" y="450" width="180" height="56" rx="12" fill="#081A12" stroke="#1E5630" stroke-width="1.5"/>
  <rect x="40" y="450" width="5" height="56" rx="2.5" fill="#2AD267"/>
  <rect x="54" y="462" width="120" height="7" rx="3.5" fill="#2AD267" opacity="0.85"/>
  <rect x="54" y="476" width="100" height="4" rx="2" fill="#1A4828" opacity="0.6"/>
  <rect x="54" y="486" width="110" height="4" rx="2" fill="#1A4828" opacity="0.55"/>
  <!-- Connector step 1 → card -->
  <line x1="130" y1="442" x2="130" y2="450" stroke="#1E5630" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- ─── STEP 2 — Planifier (mid left) ──────────────────────────────── -->
  <ellipse cx="340" cy="200" rx="70" ry="70" fill="#2AD267" opacity="0.08"/>
  <circle cx="340" cy="200" r="52" fill="#081A12" stroke="#7DFF99" stroke-width="2.5"/>
  <circle cx="340" cy="200" r="40" fill="#0A2016" stroke="#1E5630" stroke-width="1"/>
  <!-- Number -->
  <text x="340" y="192" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#7DFF99" text-anchor="middle" opacity="0.95">02</text>
  <!-- Icon: target / plan -->
  <circle cx="340" cy="212" r="12" fill="none" stroke="#7DFF99" stroke-width="1.5"/>
  <circle cx="340" cy="212" r="7"  fill="none" stroke="#2AD267" stroke-width="1"/>
  <circle cx="340" cy="212" r="2.5" fill="#7DFF99" opacity="0.9"/>

  <!-- Step 2 card -->
  <rect x="250" y="36" width="180" height="56" rx="12" fill="#081A12" stroke="#1E5630" stroke-width="1.5"/>
  <rect x="250" y="36" width="5" height="56" rx="2.5" fill="#7DFF99"/>
  <rect x="264" y="48" width="120" height="7" rx="3.5" fill="#7DFF99" opacity="0.8"/>
  <rect x="264" y="62" width="104" height="4" rx="2" fill="#1A4828" opacity="0.6"/>
  <rect x="264" y="72" width="114" height="4" rx="2" fill="#1A4828" opacity="0.55"/>
  <!-- Connector step 2 → card -->
  <line x1="340" y1="148" x2="340" y2="92" stroke="#1E5630" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- ─── STEP 3 — Animer (mid right) ────────────────────────────────── -->
  <ellipse cx="540" cy="300" rx="70" ry="70" fill="#2AD267" opacity="0.08"/>
  <circle cx="540" cy="300" r="52" fill="#081A12" stroke="#2AD267" stroke-width="2.5"/>
  <circle cx="540" cy="300" r="40" fill="#0A2016" stroke="#1E5630" stroke-width="1"/>
  <!-- Number -->
  <text x="540" y="292" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#2AD267" text-anchor="middle" opacity="0.95">03</text>
  <!-- Icon: lightning / active -->
  <polygon points="544,304 538,318 542,318 538,332 550,314 545,314 551,304" fill="#2AD267" opacity="0.9"/>

  <!-- Step 3 card -->
  <rect x="452" y="360" width="180" height="56" rx="12" fill="#081A12" stroke="#1E5630" stroke-width="1.5"/>
  <rect x="452" y="360" width="5" height="56" rx="2.5" fill="#2AD267"/>
  <rect x="466" y="372" width="120" height="7" rx="3.5" fill="#2AD267" opacity="0.85"/>
  <rect x="466" y="386" width="108" height="4" rx="2" fill="#1A4828" opacity="0.6"/>
  <rect x="466" y="396" width="118" height="4" rx="2" fill="#1A4828" opacity="0.55"/>
  <!-- Connector step 3 → card -->
  <line x1="540" y1="352" x2="540" y2="360" stroke="#1E5630" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- ─── STEP 4 — Mesurer (top right) ───────────────────────────────── -->
  <ellipse cx="720" cy="160" rx="70" ry="70" fill="#7DFF99" opacity="0.07"/>
  <circle cx="720" cy="160" r="52" fill="#081A12" stroke="#7DFF99" stroke-width="2.5"/>
  <circle cx="720" cy="160" r="40" fill="#0A2016" stroke="#1E5630" stroke-width="1"/>
  <!-- Number -->
  <text x="720" y="152" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#7DFF99" text-anchor="middle" opacity="0.95">04</text>
  <!-- Icon: upward arrow / measure -->
  <line x1="720" y1="178" x2="720" y2="162" stroke="#7DFF99" stroke-width="2" stroke-linecap="round"/>
  <polygon points="714,167 720,156 726,167" fill="#7DFF99" opacity="0.9"/>
  <line x1="710" y1="178" x2="730" y2="178" stroke="#1E5630" stroke-width="1.5"/>

  <!-- Step 4 card -->
  <rect x="580" y="36" width="190" height="56" rx="12" fill="#081A12" stroke="#1E5630" stroke-width="1.5"/>
  <rect x="580" y="36" width="5" height="56" rx="2.5" fill="#7DFF99"/>
  <rect x="594" y="48" width="130" height="7" rx="3.5" fill="#7DFF99" opacity="0.8"/>
  <rect x="594" y="62" width="110" height="4" rx="2" fill="#1A4828" opacity="0.6"/>
  <rect x="594" y="72" width="120" height="4" rx="2" fill="#1A4828" opacity="0.55"/>
  <!-- Connector step 4 → card -->
  <line x1="720" y1="108" x2="720" y2="92" stroke="#1E5630" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- ─── Progress bar at bottom ──────────────────────────────────────── -->
  <rect x="60" y="490" width="680" height="8" rx="4" fill="#081A12" stroke="#152C1E" stroke-width="1"/>
  <rect x="60" y="490" width="510" height="8" rx="4" fill="url(#glow-m1)"/>
  <rect x="60" y="490" width="510" height="8" rx="4" fill="#1E5630" opacity="0.6"/>
  <!-- Progress fill -->
  <rect x="60" y="490" width="340" height="8" rx="4" fill="#2AD267" opacity="0.85"/>
  <!-- Step markers on bar -->
  <circle cx="60"  cy="494" r="6" fill="#2AD267" stroke="#081A12" stroke-width="1.5"/>
  <circle cx="287" cy="494" r="6" fill="#2AD267" stroke="#081A12" stroke-width="1.5"/>
  <circle cx="400" cy="494" r="6" fill="#2AD267" stroke="#081A12" stroke-width="1.5"/>
  <circle cx="514" cy="494" r="6" fill="#1E5630" stroke="#081A12" stroke-width="1.5"/>
  <circle cx="740" cy="494" r="6" fill="#081A12" stroke="#1E5630" stroke-width="1.5"/>

  <!-- ─── Side detail elements ────────────────────────────────────────── -->
  <!-- Mini analytics widget right side -->
  <rect x="630" y="380" width="140" height="80" rx="10" fill="#081A12" stroke="#1A3D22" stroke-width="1"/>
  <rect x="642" y="394" width="80" height="5" rx="2.5" fill="#2AD267" opacity="0.7"/>
  <rect x="642" y="406" width="60" height="4" rx="2"   fill="#1A4828" opacity="0.5"/>
  <!-- Mini sparkline -->
  <polyline points="642,448 658,440 674,443 690,432 706,435 722,422 738,426 754,418"
            stroke="#2AD267" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="754" cy="418" r="3.5" fill="#7DFF99"/>

  <!-- Floating particles -->
  <circle cx="44"  cy="200" r="2"   fill="#2AD267" opacity="0.5"/>
  <circle cx="780" cy="320" r="2.5" fill="#7DFF99" opacity="0.45"/>
  <circle cx="760" cy="470" r="1.8" fill="#2AD267" opacity="0.35"/>
  <circle cx="30"  cy="470" r="2"   fill="#7DFF99" opacity="0.3"/>
  <circle cx="400" cy="18"  r="1.5" fill="#2AD267" opacity="0.4"/>
  <circle cx="200" cy="490" r="1.5" fill="#7DFF99" opacity="0.3"/>
</svg>
